add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Cache-Control $privacy_cache always;
proxy_hide_header Retry-After;
add_header Retry-After $retry_after always;
limit_conn_status 429;
limit_req_status 429;
error_page 408 = @upload_timeout;
error_page 413 = @too_large;
error_page 429 = @rate_limited;
error_page 502 503 504 = @unavailable;
location @upload_timeout { default_type application/json; return 408 '{"error":{"code":"UPLOAD_TIMEOUT","message":"Upload took too long."}}'; }
location @too_large { default_type application/json; return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"Choose a photo no larger than 10 MB."}}'; }
location @rate_limited { default_type application/json; return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again in a minute."}}'; }
location @unavailable { default_type application/json; return 503 '{"error":{"code":"MATCHING_NOT_READY","message":"Matching is temporarily unavailable."}}'; }
location = /api/match {
    proxy_hide_header Cache-Control;
    limit_req zone=match_requests burst=3 nodelay;
    limit_conn per_client 2;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 65s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend;
}
location /media/celebrities/ {
    proxy_read_timeout 10s;
    proxy_pass http://backend;
}
location /api/ {
    proxy_hide_header Cache-Control;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend;
}
location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://frontend;
}
