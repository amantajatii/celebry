worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=match_requests:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=per_client:10m;
    map $uri $privacy_cache {
        default '';
        ~^/api/ no-store;
        ~^/match no-store;
    }
    map $status $retry_after { default ''; 429 60; 503 3; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10551296;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    upstream frontend { zone frontend_dns 64k; server web:3000 resolve; }
    upstream backend { zone backend_dns 64k; server api:8000 resolve; }
    server {
        include /etc/nginx/listen.conf;
        include /etc/nginx/routes.conf;
    }
}
